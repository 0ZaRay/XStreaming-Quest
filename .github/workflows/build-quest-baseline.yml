name: Build Quest V0.6 APK

on:
  workflow_dispatch:
  push:
    branches:
      - quest-v0-baseline
    paths:
      - '.github/workflows/build-quest-baseline.yml'
      - 'scripts/prepare-quest-ci-build.py'
      - 'scripts/prepare-quest-v05.py'
      - 'scripts/prepare-quest-v06.py'
      - 'android/**'
      - 'src/**'
      - 'index.js'
      - 'package.json'
      - 'yarn.lock'
      - '.yarnrc.yml'
      - 'patches/**'
      - 'nano-rs/**'
      - 'third-party/**'

permissions:
  contents: read

concurrency:
  group: quest-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ARM64 sideload APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bootstrap repository Yarn 4
        shell: bash
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare yarn@4.2.2 --activate
          echo "Node: $(node --version)"
          echo "Corepack: $(corepack --version)"
          echo "Yarn: $(yarn --version)"
          test "$(yarn --version)" = "4.2.2"

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 34 and NDK 23.1
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-34' \
            'build-tools;34.0.0' \
            'ndk;23.1.7779620'

      - name: Install Rust toolchain for Quest ARM64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          set -euo pipefail
          yarn install --immutable

      - name: Prepare upstream project for Quest V0.6
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare-quest-ci-build.py
          python3 scripts/prepare-quest-v05.py
          python3 scripts/prepare-quest-v06.py

      - name: Verify Quest V0.6 security and patch invariants
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {redactLogValue} = require('./src/utils/safeConsole');
          const assert = require('node:assert/strict');

          const nested = redactLogValue({
            access_token: 'secret-access-token',
            Authorization: 'Bearer secret-header-token',
            sessionId: 'secret-session-id',
            accessKey: 'secret-xbox-access-key',
            clientAppInstallId: 'secret-install-id',
            profile: {gamertag: 'private-gamertag'},
            diagnostic: 'kept',
          });
          assert.equal(nested.access_token, '[REDACTED]');
          assert.equal(nested.Authorization, '[REDACTED]');
          assert.equal(nested.sessionId, '[REDACTED]');
          assert.equal(nested.accessKey, '[REDACTED]');
          assert.equal(nested.clientAppInstallId, '[REDACTED]');
          assert.equal(nested.profile.gamertag, '[REDACTED]');
          assert.equal(nested.diagnostic, 'kept');

          const xboxChannel = redactLogValue(
            JSON.stringify({
              message: 'authorizationRequest',
              accessKey: 'secret-xbox-access-key',
              diagnostic: 'kept',
            }),
          );
          assert.equal(xboxChannel.includes('secret-xbox-access-key'), false);
          assert.equal(xboxChannel.includes('[REDACTED]'), true);
          assert.equal(xboxChannel.includes('diagnostic'), true);

          const serialized = redactLogValue(
            JSON.stringify({sdp: 'a=ice-pwd:secret', ok: true}),
          );
          assert.equal(serialized.includes('secret'), false);
          assert.equal(serialized.includes('[REDACTED]'), true);

          const flattened = redactLogValue(
            "authorizationRequest accessKey='secret-flat-access-key' status=ok",
          );
          assert.equal(flattened.includes('secret-flat-access-key'), false);
          assert.equal(flattened.includes('[REDACTED]'), true);

          const bearer = redactLogValue('Authorization: Bearer abc.def.ghi');
          assert.equal(bearer.includes('abc.def.ghi'), false);
          assert.equal(bearer.includes('[REDACTED]'), true);

          console.log('Quest V0.6 log-redaction checks passed.');
          NODE

          grep -q "restartApp" android/app/src/main/java/com/xstreaming/AudioSettingModule.java
          grep -q "setEnabledSync" android/app/src/main/java/com/xstreaming/LowLatencyDecoderConfig.java
          grep -q "\[QuestPerf\]" src/webrtc/index.ts
          grep -q "Restart XStreaming to apply" src/components/QuestQuickSettingsPanel.tsx
          echo 'Quest V0.6 patch-invariant checks passed.'

      - name: Build standalone ARM64 APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew \
            assembleProdRelease \
            -PreactNativeArchitectures=arm64-v8a \
            --stacktrace \
            --no-daemon

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/prod/release/app-prod-release.apk'
          test -f "$APK"
          mkdir -p out
          cp "$APK" out/XStreaming-Quest-v0.6.apk
          sha256sum out/XStreaming-Quest-v0.6.apk | tee out/SHA256SUMS.txt

      - name: Upload Quest APK
        uses: actions/upload-artifact@v4
        with:
          name: XStreaming-Quest-v0.6
          path: |
            out/XStreaming-Quest-v0.6.apk
            out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
